<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <form class="weatherForm">
        <input type="text" class="cityInput" placeholder="Enter city">
        <button type="submit">Get weather</button>
    </form>


    <!-- This is only static currently for styling purposes-->
    <div class="card" style="display: none">
        <h1 class="cityDisplay">Tallinn</h1>
        <p class="tempDisplay"0°C></p>
        <p class="humidityDisplay"> Humidity: %</p>
        <p class="descDisplay">Clear Skies</p>
        <p class="weatherEmoji">☀️</p>
        <p class="errorDisplay">Please enter a city</p>
    </div>

    <script src="index.js"></script>
</body>
</html>
